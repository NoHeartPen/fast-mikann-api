{% extends "base.html" %}

{% block title %}
Mikann Jishokei Example
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-lg-8 offset-lg-2">
            <h1 class="mb-4">Mikann Example</h1>

            <ul class="list-group">
                {% for route in example_routes %}
                <li class="list-group-item">
                    <a href="{{ route.path }}" class="text-decoration-none">{{ route.description }}</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>
{% endblock %}
