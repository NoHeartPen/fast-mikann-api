{% extends "example/base.html" %}

{% block title %}Error - FastMikannAPI{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="alert alert-danger text-center" role="alert">
                <h1 class="display-5"><i class="bi bi-exclamation-triangle-fill"></i> {{ status_code }} {{ status_message }}</h1>
                <p class="lead">{{ error_message|safe }}</p>
                <hr>
                <p>If the issue persists, please contact support or visit our <a href="https://github.com/NoHeartPen/fast-mikann-api"
                                                                                 target="_blank">GitHub Repository</a>.</p>
                <a href="/" class="btn btn-primary mt-3"><i class="bi bi-house-door"></i> Back to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
